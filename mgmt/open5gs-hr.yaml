apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open5gs
spec:
  interval: 5m

  # releaseName must be set explicitly: targetNamespace differs from the object's
  # own namespace, so Flux would otherwise name the release <targetNamespace>-<name>
  # ("sandbox-open5gs") and prefix every rendered resource with it — which breaks
  # ueransim's `amf.hostname: open5gs-amf-ngap`.
  releaseName: open5gs

  # WHERE the release lands: namespace `sandbox` of the WORKLOAD cluster, reached
  # through the CAPI-generated kubeconfig secret. WC_KUBECONFIG_SECRET is filled in
  # by the Sylva Kustomization's postBuild.substitute (see sylva/telco-demo-units.yaml).
  targetNamespace: sandbox
  storageNamespace: sandbox
  kubeConfig:
    secretRef:
      name: ${WC_KUBECONFIG_SECRET}

  chart:
    spec:
      chart: open5gs
      version: "2.2.6"
      sourceRef:
        kind: HelmRepository
        name: gradiant

  # The default 5m is not enough: ~16 pods, and MongoDB's populate job runs last.
  timeout: 30m
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    remediation:
      retries: 3

  # Values come from a ConfigMap generated by kustomize from values/open5gs-values.yaml.
  # The generated name carries a content hash, so editing the values file produces a
  # new ConfigMap name and a real HelmRelease change — that is what makes `git push`
  # actually redeploy. configuration.yaml teaches kustomize to rewrite this reference.
  valuesFrom:
  - kind: ConfigMap
    name: open5gs-values
    valuesKey: values.yaml
