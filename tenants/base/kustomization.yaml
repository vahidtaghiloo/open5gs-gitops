apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No 'namespace:' here on purpose -- this overlay creates the namespaces, and each
# namespaced object carries its own metadata.namespace. The Sylva unit sets
# targetNamespace: null so Flux does not try to rewrite them.
resources:
  - namespaces.yaml
  - networks.yaml
  - rbac.yaml
  - networkpolicies.yaml
