---
# Default-deny on the PRIMARY cluster network, then allow intra-namespace traffic.
#
# Accuracy point worth making to the examiner: a NetworkPolicy is enforced by the
# primary CNI (Calico) on eth0. It does NOT govern the Multus secondary interface
# -- net1 traffic never passes through Calico's dataplane at all. So the two
# isolation mechanisms in this demo are genuinely different layers:
#   * eth0 (management plane)  -> isolated by NetworkPolicy, at L3/L4
#   * net1 (data plane)        -> isolated by the VLAN on br-dp, at L2
#                                 (in production: by the SR-IOV VF + VLAN tag)
# That split is precisely how real telco infrastructure sharing is built.

# ── Tenant A ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}

# ── Tenant B ─────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: tenant-b
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
