---
# tenant-b-cp / tenant-b-worker: a real 2-node Kubernetes cluster for Tenant B
# (LegacyCo), running as two KubeVirt VMs on the shared workload cluster.
#
# WHY NOT Cluster API Provider for KubeVirt (CAPK): it does not exist in Sylva.
# Building it would mean replicating the entire CAPM3 integration (a new
# kustomize-units/capk, a new infra_provider: capk schema branch, and touching
# every capm3-specific conditional across charts/sylva-units/values.yaml) --
# core platform engineering, not something that belongs in a tenant's own
# GitOps repo. So this cluster is bootstrapped the way any tenant without
# access to Cluster API would do it: cloud-init runs k3s's own install script
# on first boot. No orchestration layer sits above KubeVirt.
#
# Networking, per VM:
#   eth0 (name: default)    -- cluster CNI via KubeVirt masquerade. This
#                               carries the k3s control-plane/join traffic:
#                               the Service below gives the worker a stable
#                               DNS name for the API server, independent of
#                               the control-plane VM's actual pod IP.
#   eth1 (name: dataplane)  -- Multus secondary, the same tenant-b-dp slice
#                               (bridge/VLAN 200) tenant-b already has.
#                               Present on both nodes to match the
#                               "eth0 + net1 per VM" model -- it is the
#                               tenant's own rented data plane, for whatever
#                               the tenant runs on top of its own cluster.
#                               k3s's control-plane traffic does not use it.
#
# Both VMs get an all-interfaces-DHCP netplan for free: cloud-init's NoCloud
# datasource generates that config automatically when no networkData is
# supplied, and KubeVirt's virt-launcher runs a small per-interface DHCP
# server that hands out the masquerade address on eth0 and the
# whereabouts-assigned address on eth1. The k3s agent retries its connection
# to K3S_URL indefinitely, so there is no boot-order race to handle even
# though the worker's install script may start before the control plane's is
# actually serving.
#
# Shared join token: fixed in-repo since this is an isolated demo network with
# no external exposure. In production this would be a Sylva-managed secret.
apiVersion: v1
kind: Service
metadata:
  name: tenant-b-cp-api
  namespace: tenant-b
spec:
  selector:
    kubevirt.io/domain: tenant-b-cp
  ports:
    - port: 6443
      targetPort: 6443
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: tenant-b-cp
  labels: {sylva.telco/tenant: legacyco, sylva.telco/role: nested-control-plane}
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: tenant-b-cp
        sylva.telco/tenant: legacyco
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - name: containerdisk
              disk: {bus: virtio}
            - name: cloudinitdisk
              disk: {bus: virtio}
          interfaces:
            - name: default
              masquerade: {}
            - name: dataplane
              bridge: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
        - name: dataplane
          multus:
            networkName: tenant-b-dp
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - curl -sfL https://get.k3s.io | K3S_TOKEN=sylva-tenant-b-demo-token sh -s - server --tls-san tenant-b-cp-api.tenant-b.svc.cluster.local --disable traefik --disable servicelb --disable metrics-server
      # Uncomment if the workload node carries a control-plane NoSchedule taint:
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: tenant-b-worker
  labels: {sylva.telco/tenant: legacyco, sylva.telco/role: nested-worker}
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: tenant-b-worker
        sylva.telco/tenant: legacyco
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - name: containerdisk
              disk: {bus: virtio}
            - name: cloudinitdisk
              disk: {bus: virtio}
          interfaces:
            - name: default
              masquerade: {}
            - name: dataplane
              bridge: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
        - name: dataplane
          multus:
            networkName: tenant-b-dp
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              runcmd:
                - curl -sfL https://get.k3s.io | K3S_URL=https://tenant-b-cp-api.tenant-b.svc.cluster.local:6443 K3S_TOKEN=sylva-tenant-b-demo-token sh -
      # Uncomment if the workload node carries a control-plane NoSchedule taint:
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
