---
# probe-b1: netshoot pod for Tenant B (LegacyCo).
#
# A container and a nested Kubernetes cluster sharing one L2 slice -- this is
# the point of KubeVirt in this demo. Tenant B's own 2-node cluster
# (tenant-b-cp, tenant-b-worker -- see nested-cluster.yaml) and this sidecar
# tooling sit on the same rented segment (bridge/VLAN 200 in lab; SR-IOV VF in
# production).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-b1
  labels: {app: probe-b1, sylva.telco/tenant: legacyco}
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe-b1}
  template:
    metadata:
      labels: {app: probe-b1, sylva.telco/tenant: legacyco}
      annotations:
        k8s.v1.cni.cncf.io/networks: tenant-b-dp
    spec:
      serviceAccountName: tenant-b-operator
      containers:
        - name: tools
          image: nicolaka/netshoot:v0.13
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 128Mi}
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: Exists
      #     effect: NoSchedule
